name: Release

# Pushing a tag runs the checks (unit tests and screenshots on macOS, lint on Linux), builds a
# signed release APK and a debug APK, and publishes both as a GitHub release. Two kinds of tag are
# accepted:
#   vX.Y.Z                 a final release. The tagged commit must be on main.
#   vX.Y.Z-rc.N / -beta.N  a pre-release, published as a GitHub pre-release. It may come from any
#                          branch, so a change can be test-built before it is merged.
# The version comes from the tag alone (scripts/release-version.sh): versionName is the tag
# without the v, and versionCode rises from beta to rc to final, so there is no bump commit.
# See docs/releasing.md.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'

permissions:
  contents: read

env:
  # The signing certificates every release must carry, so installs keep updating in place. The
  # debug one is the maintainer's own debug key, which is why the debug APK installs over the
  # build on their phone without an uninstall.
  EXPECTED_RELEASE_CERT_SHA256: c53fb7dc86f3af2b4e8f758bd6511d3e12b0c337673d42b1f432ea1e8fee645b
  EXPECTED_DEBUG_CERT_SHA256: ac5aab961fcbd1631111123a23e24084ef6c265b3439a8048fc0862c2743ab61

jobs:
  # The same gate as build.yml, and on macOS for the same reason: the screenshot baselines were
  # recorded there and Linux renders them differently. Nothing is built or signed until it passes.
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Unit tests and screenshots
        run: ./gradlew test verifyRoborazziDebug

  release:
    needs: checks
    runs-on: ubuntu-latest
    # The signing secrets live in this environment, not at repository level, and the environment
    # only deploys from v* tags, so branch pushes and pull requests can't read them. It has no
    # required reviewer. See docs/releasing.md.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive the version from the tag
        id: version
        run: |
          # On a bad tag the script prints a ::error:: annotation, which must reach the log, not
          # $GITHUB_OUTPUT.
          if ! out=$(scripts/release-version.sh "$GITHUB_REF_NAME"); then
            echo "$out"
            exit 1
          fi
          echo "$out" >> "$GITHUB_OUTPUT"
          echo "$out" | tr '\n' ' '
          echo

      - name: Require a final release to be on main
        if: steps.version.outputs.prerelease == 'false'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main. Release only from main."
            exit 1
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Lint
        run: ./gradlew lint

      - name: Write signing material
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF
          # AGP signs the debug variant with ~/.android/debug.keystore and makes a fresh one when
          # it is missing, which would give every release a different debug certificate.
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"

      - name: Build the release and debug APKs
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        # -P overrides the defaults in app/build.gradle.kts.
        run: ./gradlew assembleRelease assembleDebug -PVERSION_NAME="$VERSION_NAME" -PVERSION_CODE="$VERSION_CODE"

      - name: Remove signing material
        if: always()
        run: rm -f release.keystore keystore.properties "$HOME/.android/debug.keystore"

      - name: Verify the APKs
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          release_apk=app/build/outputs/apk/release/app-release.apk
          debug_apk=app/build/outputs/apk/debug/app-debug.apk
          # An unsigned release build is named app-release-unsigned.apk.
          for f in "$release_apk" "$debug_apk"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::$f was not produced"
              exit 1
            fi
          done

          check() { # <apk> <expected cert>
            local cert badging code name_in_apk
            cert=$("$bt/apksigner" verify --print-certs "$1" | sed -nE 's/.*certificate SHA-256 digest: //p' | head -1)
            if [[ "$cert" != "$2" ]]; then
              echo "::error::$1 is signed with $cert, expected $2"
              exit 1
            fi
            badging=$("$bt/aapt2" dump badging "$1")
            code=$(sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" <<<"$badging" | head -1)
            name_in_apk=$(sed -nE "s/.*versionName='([^']*)'.*/\1/p" <<<"$badging" | head -1)
            if [[ "$code" != "$EXPECTED_CODE" || "$name_in_apk" != "$VERSION_NAME" ]]; then
              echo "::error::$1 is $name_in_apk ($code), expected $VERSION_NAME ($EXPECTED_CODE)"
              exit 1
            fi
          }
          check "$release_apk" "$EXPECTED_RELEASE_CERT_SHA256"
          check "$debug_apk" "$EXPECTED_DEBUG_CERT_SHA256"

          # An update only installs if its versionCode is higher than the previous release's. A
          # final is compared with the latest final, a pre-release with the latest of any kind.
          # An empty result (no earlier release) skips the check.
          if [[ "$PRERELEASE" == true ]]; then
            prev_tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)
          else
            prev_tag=$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName' || true)
          fi
          if [[ -n "$prev_tag" ]]; then
            mkdir "$RUNNER_TEMP/prev"
            gh release download "$prev_tag" --pattern '*.apk' --dir "$RUNNER_TEMP/prev"
            # Both APKs of a release carry the same code, so either one will do.
            prev_apk=$(find "$RUNNER_TEMP/prev" -name '*.apk' | sort | head -1)
            prev_code=$("$bt/aapt2" dump badging "$prev_apk" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" | head -1)
            if (( EXPECTED_CODE <= prev_code )); then
              echo "::error::versionCode $EXPECTED_CODE is not greater than $prev_tag's $prev_code"
              exit 1
            fi
          fi

          mkdir release
          cp "$release_apk" "release/swiftcurrent-$VERSION_NAME.apk"
          cp "$debug_apk" "release/swiftcurrent-$VERSION_NAME-debug.apk"
          (cd release && sha256sum ./*.apk > SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          kind=Release
          flags=()
          if [[ "$PRERELEASE" == true ]]; then
            kind=Pre-release
            flags+=(--prerelease)
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          $kind Swiftcurrent $VERSION_NAME (versionCode $VERSION_CODE), built from commit \`$GITHUB_SHA\`.

          - \`swiftcurrent-$VERSION_NAME.apk\`: the release build. Signing certificate SHA-256: \`$EXPECTED_RELEASE_CERT_SHA256\`
          - \`swiftcurrent-$VERSION_NAME-debug.apk\`: the debug build, signed with the maintainer's debug key (\`$EXPECTED_DEBUG_CERT_SHA256\`)
          - \`SHA256SUMS\`: checksums of both APKs

          The two builds are signed with different keys, so switching between them means uninstalling first, which wipes local data.
          EOF
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Swiftcurrent $VERSION_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            "${flags[@]}"
