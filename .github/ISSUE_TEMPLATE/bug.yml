name: Bug
description: Something the launcher does that it should not
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to get there
      description: |
        The shortest path from a fresh home screen to the problem. Settings that matter are
        part of this — most of what looks broken turns out to depend on one of them.
      placeholder: |
        1. Swipe up from the right edge to open the app list
        2. Long-press an app, Rename
        3. The name reverts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Swiftcurrent version
      description: The release you installed, or the version at the bottom of the app's system info page.
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: "Pixel 8, Android 15"
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshot or recording
      description: |
        Optional, and worth more than any description for anything about how something looks or
        moves. Drag the file into this box.
