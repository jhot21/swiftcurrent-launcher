# Memory for the Gradle daemon and the Kotlin compiler.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8

# Build-loop speed: reuse task output between builds, run independent tasks in
# parallel, and skip re-running the configuration phase when nothing changed.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
